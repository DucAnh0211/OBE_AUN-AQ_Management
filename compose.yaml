name: obe-aun-qa

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-obe_management}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready --username "$${POSTGRES_USER}" --dbname "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12

  database-init:
    build:
      context: .
      dockerfile: tools/database/Dockerfile
    restart: "no"
    environment:
      ConnectionStrings__Postgres: >-
        Host=db;Port=5432;Database=${POSTGRES_DB:-obe_management};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      Database__SeedDemo: ${SEED_DEMO:-true}
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__Postgres: >-
        Host=db;Port=5432;Database=${POSTGRES_DB:-obe_management};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      Cors__AllowedOrigins__0: http://localhost:5173
      Cors__AllowedOrigins__1: ${CORS_ORIGIN:-http://localhost:8080}
      OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_DOCKER_ENDPOINT:-http://minio:9000}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-obe-knowledge}
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-minioadmin}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-change_minio_password}
      AI_SERVICE_URL: http://ai:8000
      AI_SERVICE_KEY: ${AI_SERVICE_KEY:-}
      Jwt__Issuer: ObeAunQa.Api
      Jwt__Audience: ObeAunQa.Web
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env}
      BootstrapAdmin__Email: ${BOOTSTRAP_ADMIN_EMAIL:?Set BOOTSTRAP_ADMIN_EMAIL in .env}
      BootstrapAdmin__Password: ${BOOTSTRAP_ADMIN_PASSWORD:?Set BOOTSTRAP_ADMIN_PASSWORD in .env}
      BootstrapAdmin__FullName: ${BOOTSTRAP_ADMIN_FULL_NAME:-Quản trị viên}
    ports:
      - "${API_PORT:-5099}:8080"
    depends_on:
      database-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - http://127.0.0.1:8080/health/ready
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ""
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --tries=1
        - --spider
        - http://127.0.0.1/
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 6

  minio:
    profiles: ["storage"]
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2025-09-07T16-13-09Z}
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_SECRET_KEY:-change_minio_password}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data

  ai:
    profiles: ["ai"]
    build:
      context: .
      dockerfile: apps/ai-service/Dockerfile
    environment:
      AI_SERVICE_KEY: ${AI_SERVICE_KEY:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      CHAT_MODEL: ${CHAT_MODEL:-gpt-4.1-mini}
      RERANK_MODEL: ${RERANK_MODEL:-gpt-4.1-mini}
      DOTNET_API_URL: http://api:8080
      OCR_LANGUAGES: ${OCR_LANGUAGES:-vie+eng}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${AI_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 6

volumes:
  postgres_data:
  minio_data:
